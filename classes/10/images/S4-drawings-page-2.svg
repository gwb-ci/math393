<style>
  .cut {
    fill:none;
    stroke:#000;
    stroke-width:1.2;
    stroke-dasharray:7 5;
  }
  .node {
    fill:#fff;
    stroke:#000;
    stroke-width:1.6;
  }
  .edge {
    fill:none;
    stroke:#000;
    stroke-width:1.8;
  }
  .label {
    font-family:"Times New Roman", serif;
    font-size:16px;
    text-anchor:middle;
    dominant-baseline:middle;
  }
</style>

<defs>
