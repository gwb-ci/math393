<svg xmlns="http://www.w3.org/2000/svg"
     width="8.5in" height="11in"
     viewBox="0 0 816 1056">

<style>
  .cut {
    fill:none;
    stroke:#000;
    stroke-width:1.2;
    stroke-dasharray:7 5;
  }
  .node {
    fill:#fff;
    stroke:#000;
    stroke-width:1.6;
  }
  .edge {
    fill:none;
    stroke:#000;
    stroke-width:1.8;
  }
  .label {
    font-family:"Times New Roman", serif;
    font-size:15px;
    text-anchor:middle;
    dominant-baseline:middle;
  }
</style>

<defs>
  <g id="nodes5">
    <circle class="node" cx="45"  cy="42"  r="12"/>
    <circle class="node" cx="85"  cy="42"  r="12"/>
