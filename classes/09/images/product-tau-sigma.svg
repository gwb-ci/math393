<svg xmlns="http://www.w3.org/2000/svg" width="390" height="300" viewBox="0 0 390 300">
<style>
.node{fill:#fff;stroke:#000;stroke-width:2}
.tau{stroke:#cb4b16;stroke-width:3}
.sigma{stroke:#268bd2;stroke-width:3}
.label{font-family:serif;font-size:21px;text-anchor:middle;dominant-baseline:middle}
.name{font-family:serif;font-size:22px}
</style>

<text class="name" x="20" y="95" fill="#268bd2">σ</text>
<text class="name" x="20" y="210" fill="#cb4b16">τ</text>

<line class="sigma" x1="90" y1="40" x2="195" y2="145"/>
<line class="sigma" x1="195" y1="40" x2="300" y2="145"/>
<line class="sigma" x1="300" y1="40" x2="90" y2="145"/>

<line class="tau" x1="90" y1="145" x2="195" y2="260"/>
<line class="tau" x1="195" y1="145" x2="90" y2="260"/>
<line class="tau" x1="300" y1="145" x2="300" y2="260"/>

<g class="node">
<circle cx="90" cy="40" r="20"/><circle cx="195" cy="40" r="20"/><circle cx="300" cy="40" r="20"/>
<circle cx="90" cy="145" r="20"/><circle cx="195" cy="145" r="20"/><circle cx="300" cy="145" r="20"/>
<circle cx="90" cy="260" r="20"/><circle cx="195" cy="260" r="20"/><circle cx="300" cy="260" r="20"/>
</g>

<g class="label">
<text x="90" y="40">1</text><text x="195" y="40">2</text><text x="300" y="40">3</text>
<text x="90" y="145">1</text><text x="195" y="145">2</text><text x="300" y="145">3</text>
<text x="90" y="260">1</text><text x="195" y="260">2</text><text x="300" y="260">3</text>
</g>
</svg>