<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 180">
  <rect width="700" height="180" fill="white"/>

  <!-- connecting lines -->
  <g stroke="black" stroke-width="2">
    <line x1="70"  y1="40" x2="210" y2="140"/>
    <line x1="210" y1="40" x2="350" y2="140"/>
    <line x1="350" y1="40" x2="70"  y2="140"/>
    <line x1="490" y1="40" x2="630" y2="140"/>
    <line x1="630" y1="40" x2="490" y2="140"/>
  </g>

  <!-- nodes -->
  <g fill="white" stroke="black" stroke-width="2">
    <circle cx="70"  cy="40" r="20"/>
    <circle cx="210" cy="40" r="20"/>
    <circle cx="350" cy="40" r="20"/>
    <circle cx="490" cy="40" r="20"/>
    <circle cx="630" cy="40" r="20"/>

    <circle cx="70"  cy="140" r="20"/>
    <circle cx="210" cy="140" r="20"/>
    <circle cx="350" cy="140" r="20"/>
    <circle cx="490" cy="140" r="20"/>
    <circle cx="630" cy="140" r="20"/>
  </g>

  <!-- labels -->
  <g fill="black"
     font-family="serif"
     font-size="20"
     text-anchor="middle"
     dominant-baseline="central">

    <text x="70"  y="40">1</text>
    <text x="210" y="40">2</text>
    <text x="350" y="40">3</text>
    <text x="490" y="40">4</text>
    <text x="630" y="40">5</text>

    <text x="70"  y="140">1</text>
    <text x="210" y="140">2</text>
    <text x="350" y="140">3</text>
    <text x="490" y="140">4</text>
    <text x="630" y="140">5</text>
  </g>
</svg>